async function submitRecharge(){let b=$('submitRecharge'),s=$('rechargeStatus');b.disabled=true;s.textContent='正在提交…';try{let r=await fetch('/api/billing/recharge-requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({points:$('rechargePoints').value,payment_reference:$('paymentReference').value.trim()})}),d=await r.json();if(!r.ok)throw Error(d.detail||'提交失败');s.textContent=`申请已提交：${d.order.requested_points} 点 / ¥${d.order.amount_cents/100}，等待审核。`;if(view==='account')loadAccountOrders()}catch(e){s.textContent=e.message}finally{b.disabled=false}}
$('closeModal').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};async function health(){try{let r=await fetch('/api/health');if(!r.ok)throw 0;let d=await r.json();$('dot').classList.add('ok');$('service').textContent=d.queue?.active_job_id?'正在生成':'服务在线'}catch{$('dot').classList.remove('ok');$('service').textContent='服务未连接'}};function clientId(){const key='ppt_workbench_client_id';let value=localStorage.getItem(key);if(!value){value=crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2);localStorage.setItem(key,value)}return value};async function heartbeat(){try{await fetch('/api/presence/heartbeat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_id:clientId(),page:view||'workbench'})})}catch{}}
async function loadAccount(){try{let r=await fetch('/api/auth/me');if(r.status===401){location.href='/login?return_to=/workbench';return}let d=await r.json(),u=d.user,p=d.page_pricing||{points_per_page:1};pagePrice=Number(p.points_per_page);$('points').textContent=u.points;$('avatar').textContent=u.phone.slice(-2);showQuota(d.timed_page_quota)}catch(e){toast('账户服务暂不可用')}}
async function checkPriceAnnouncement(){try{let r=await fetch('/api/announcements',{cache:'no-store'}),d=await r.json();if(!r.ok)return;let item=(d.announcements||[]).find(x=>x.title==='页单价调整');if(!item)return;let key='pptx-last-price-announcement';if(localStorage.getItem(key)===item.id)return;localStorage.setItem(key,item.id);toast(item.content||'页单价已调整，请在账户页面查看。')}catch(_){}}
const requestedJob=new URLSearchParams(location.search).get('job');
let initial=new URLSearchParams(location.search).get('view');render();bind();show(['new','projects','templates','convert','account','settings','feedback'].includes(initial)?initial:'new');restoreLatestImageConversion();let saved=localStorage.getItem('pptx-style');if(saved&&$('style')){$('style').value=saved;localStorage.removeItem('pptx-style')}loadAccount();checkPriceAnnouncement();health();heartbeat();setInterval(health,20000);setInterval(heartbeat,30000);setInterval(loadAccount,60000);setInterval(checkPriceAnnouncement,60000);
if(requestedJob&&/^job_[A-Za-z0-9_]+$/.test(requestedJob)){job=requestedJob;projectStarted=true;outlineReady=false;stage=2;show('new');history.replaceState(null,'',`?view=new&job=${encodeURIComponent(job)}`);pollJob(job)}
