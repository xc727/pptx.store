<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我们 | PPTX.STORE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Google Fonts: Noto Serif SC for headings, Noto Sans SC for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">

    <style>

        /* === Global Variables & Reset === */
        :root {
            --bg-color: #f4f3ec;
            --primary-green: #67b75b;
            --primary-green-hover: #55994b;
            --text-dark: #222222;
            --text-light: #a0a0a0;
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        h1, h2, h3, .logo { font-family: "Noto Serif SC", serif; }
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: "Noto Sans SC", sans-serif;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* === Loading Screen === */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .progress-bar-container { width: 200px; height: 4px; background-color: #ddd; border-radius: 2px; overflow: hidden; margin-top: 20px; }
        .progress-bar { width: 0%; height: 100%; background-color: var(--primary-green); }

        /* === Global Navigation === */
        header.global-nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(244, 243, 236, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .global-nav .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: var(--primary-green); text-decoration: none;}
        .global-nav .nav-links { display: flex; gap: 30px; align-items: center; }
        .global-nav .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 15px; position: relative; transition: color 0.3s ease; }
        .global-nav .nav-links a:hover { color: var(--primary-green); }
        
        /* 按钮水面波浪效果 */
        .btn-wave {
            position: relative;
            padding: 10px 24px;
            border-radius: 8px;
            background: #fff;
            color: var(--primary-green) !important;
            font-weight: bold;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: color 0.3s ease;
            display: inline-block;
        }
        .btn-wave::before {
            content: '';
            position: absolute;
            bottom: -50%; left: -50%;
            width: 200%; height: 200%;
            background-color: var(--primary-green);
            border-radius: 40%;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
            animation: waveRotate 4s linear infinite;
        }
        @keyframes waveRotate { 0% { transform: translateY(100%) rotate(0deg); } 100% { transform: translateY(100%) rotate(360deg); } }
        .btn-wave:hover { color: #fff !important; }
        .btn-wave:hover::before { transform: translateY(-10%) rotate(0deg); animation: none; }
        
        /* Padding to prevent content from hiding under fixed header */
        .content-wrap { padding-top: 80px; min-height: calc(100vh - 300px); }

        /* === Wave Footer === */
        .wave-footer-container { position: relative; width: 100%; height: 300px; background: var(--bg-color); margin-top: 60px; overflow: hidden; }
        .waves { position: absolute; bottom: 0; width: 100%; height: 100%; min-height: 100px; max-height: 150px; }
        .parallax > use { animation: move-forever 25s cubic-bezier(.55,.5,.45,.5) infinite; }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }
        @keyframes move-forever { 0% { transform: translate3d(-90px,0,0); } 100% { transform: translate3d(85px,0,0); } }
        
        .footer-content { background-color: var(--primary-green); padding: 40px; text-align: center; color: #fff; }
        .hand-drawn-icon { width: 120px; height: 120px; margin: 0 auto -60px auto; position: relative; z-index: 10; }

        .page-header { text-align: center; padding: 80px 20px; }
        .page-header h1 { font-size: 3rem; color: var(--primary-green); margin-bottom: 20px; }
        .timeline { max-width: 800px; margin: 0 auto; padding: 40px 20px; position: relative; }
        .timeline::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: rgba(103, 183, 91, 0.2); transform: translateX(-50%); border-radius: 2px;}
        .timeline-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; opacity: 0; transform: translateY(30px); }
        .timeline-item:nth-child(even) { flex-direction: row-reverse; }
        .timeline-content { width: 45%; background: #fff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; transition: transform 0.4s var(--spring-easing); }
        .timeline-content:hover { transform: scale(1.05); z-index: 10; }
        .timeline-content h3 { color: var(--primary-green); margin-bottom: 10px; font-size: 1.5rem; }
        .timeline-content p { color: #666; line-height: 1.6; }
    </style>
</head>
<body>
    <div id="loader"><h2 style="color: var(--primary-green); letter-spacing: 2px;">PPTX.STORE</h2><div class="progress-bar-container"><div class="progress-bar" id="progress-bar"></div></div></div>

    <!-- Global Header -->
    <header class="global-nav">
        <a href="index.html" class="logo">PPTX.STORE</a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="/workbench">PPT 工作台</a>
            <a href="/book-split">文献拆分</a>
            <a href="services.html">服务介绍</a>
            <a href="about.html">关于我们</a>
            <a href="/workbench" class="btn-wave">立即体验 →</a>
        </div>
    </header>

    <div class="content-wrap">
        <div class="page-header"><h1>我们的故事</h1><p>为每个职场人解脱繁杂的排版工作</p></div>
        <div class="timeline">
            <div class="timeline-item"><div class="timeline-content"><h3>2024 - 萌芽</h3><p>我们意识到大量的知识工作者将时间浪费在枯燥的格式排版上，而不是内容本身。</p></div></div>
            <div class="timeline-item"><div class="timeline-content"><h3>2025 - 突破</h3><p>结合 NotebookLM 的超长文本理解能力，我们首创了结构化多批次大纲生成算法。</p></div></div>
            <div class="timeline-item"><div class="timeline-content"><h3>2026 - 有机融合</h3><p>引入了 Codia DSL 渲染引擎，实现了纯代码到完全可编辑 PPTX 的毫秒级跨越。</p></div></div>
        </div>
    </div>

    <!-- Global Footer -->
    <div class="wave-footer-container">
        <div class="hand-drawn-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="30" r="15" stroke="#222" stroke-width="4" fill="#f4f3ec"/>
                <path d="M50 45 L50 80 M50 60 L30 40 M50 60 L70 40 M50 80 L35 100 M50 80 L65 100" stroke="#222" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(103, 183, 91, 0.3)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(103, 183, 91, 0.5)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(103, 183, 91, 0.7)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="var(--primary-green)" />
            </g>
        </svg>
    </div>
    <div class="footer-content">
        <h2 style="margin-bottom: 20px;">PPTX.STORE</h2>
        <p>© 2026 PPT 自动化工坊. All Rights Reserved.</p>
    </div>

    <!-- === Global Base Animations === -->
    <script>
        gsap.registerPlugin(ScrollTrigger);
        window.addEventListener("load", () => {
            const tl = gsap.timeline();
            tl.to("#progress-bar", { width: "100%", duration: 0.6, ease: "power2.inOut" })
              .to("#loader", { yPercent: -100, duration: 0.6, ease: "power4.inOut" });
            
            setTimeout(() => {
                window.dispatchEvent(new Event('appLoaded'));
            }, 1200);
        });
    </script>

    <script>
        window.addEventListener('appLoaded', () => {
            gsap.utils.toArray('.timeline-item').forEach((item, i) => {
                gsap.to(item, { scrollTrigger: { trigger: item, start: "top 85%" }, opacity: 1, y: 0, duration: 0.8, ease: "back.out(1.7)", delay: i * 0.1 });
            });
        });
    </script>
</body>
</html>
