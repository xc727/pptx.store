<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐页图片精修｜PPTX.STORE</title><link rel="icon" href="/favicon.ico?v=20260914" sizes="any"><link rel="icon" type="image/png" href="/logo.png?v=20260914"><link rel="apple-touch-icon" href="/logo.png?v=20260914"><style>
:root{--b:#4658f6;--ink:#18213d;--muted:#7d869e;--line:#e2e6f0;--bg:#eef3fb;--white:#fff;--red:#ef5555}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Microsoft YaHei UI",sans-serif}button,input,textarea{font:inherit}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}header a{text-decoration:none;color:var(--ink);font-weight:800}.actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;color:var(--ink);cursor:pointer}.primary{background:var(--b);color:#fff;border-color:var(--b)}main{height:calc(100vh - 64px);display:grid;grid-template-columns:220px minmax(460px,1fr) 330px;gap:1px;background:var(--line)}aside,section{background:#fff;min-height:0;overflow:auto}.head{padding:16px;border-bottom:1px solid var(--line)}.head h2{font-size:15px;margin:0}.head p{font-size:12px;color:var(--muted);margin:4px 0 0}.thumbs{padding:12px;display:grid;gap:10px}.thumb{border:2px solid transparent;border-radius:9px;padding:0;background:#edf0f6;overflow:hidden;cursor:pointer;position:relative}.thumb.active{border-color:var(--b)}.thumb img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover}.thumb span{position:absolute;left:6px;top:6px;background:rgba(20,28,52,.8);color:#fff;border-radius:5px;padding:2px 6px;font-size:11px}.canvas-wrap{height:100%;display:grid;place-items:center;padding:26px;background:#f7f9fd}.canvas{width:min(100%,1080px);aspect-ratio:16/9;position:relative;background:#e9edf5;box-shadow:0 18px 50px rgba(34,48,91,.15);overflow:hidden}.canvas img,.canvas canvas{position:absolute;inset:0;width:100%;height:100%}.canvas img{object-fit:contain}.canvas canvas{cursor:crosshair}.side{padding:16px}.side label{display:block;font-weight:800;margin:15px 0 7px}.field,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px}textarea{min-height:130px;resize:vertical}.selection{padding:11px;border-radius:10px;background:#f3f5fb;color:var(--muted);font-size:12px}.tip{font-size:12px;color:var(--muted);line-height:1.6}.status{margin-top:12px;padding:10px;border-radius:9px;background:#f5f7fb;color:var(--muted);white-space:pre-wrap}@media(max-width:900px){main{grid-template-columns:150px 1fr}.right{grid-column:1/-1}.canvas-wrap{min-height:450px}} </style></head><body>
<header><a href="/workbench">← PPTX.STORE · 逐页图片精修</a><div class="actions"><button class="btn" id="reload">刷新预览</button><a class="btn" id="back" href="/workbench">返回工作台</a></div></header><main><aside><div class="head"><h2>页面缩略图</h2><p>选择需要修改的页面</p></div><div class="thumbs" id="thumbs"></div></aside><section><div class="canvas-wrap"><div class="canvas" id="canvas"><img id="slide" alt="当前幻灯片"><canvas id="overlay"></canvas></div></div></section><aside class="right"><div class="head"><h2>圈选重新生成</h2><p>圈出局部，再写清楚修改要求</p></div><div class="side"><div class="selection" id="selection">尚未圈选区域</div><label for="prompt">本页修改提示词</label><textarea id="prompt" placeholder="例如：只修改圈选区域，把人物图标移到卡片上方；保持其他内容、文字和版式完全不变。"></textarea><p class="tip">按住鼠标在画面上拖动圈选。修改要求会连同坐标保存到任务质量反馈中，供重新生成执行器使用。</p><button class="btn primary" id="submit" style="width:100%">提交本页重绘要求</button><div class="status" id="status">请输入工作台任务 ID，或从工作台进入本页。</div></div></aside></main><script>
(function(){var _local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1)(:\d+)?$/.test(location.host);if(_local)return;try{var x=new XMLHttpRequest;x.open('GET','http://127.0.0.1:5001/api/health',false);x.timeout=500;x.send(null);if(x.status>=200&&x.status<300){try{var o=JSON.parse(x.responseText);if(o&&o.ok){location.replace('http://127.0.0.1:5001/preview-editor'+location.search+location.hash)}}catch(_){}}}catch(_){}})();
const $=id=>document.getElementById(id),job=new URLSearchParams(location.search).get('job')||'';let pages=[],current=0,start=null,box=null;const cv=$('overlay'),ctx=cv.getContext('2d');
function resize(){const r=cv.getBoundingClientRect();cv.width=Math.round(r.width);cv.height=Math.round(r.height);draw()}function draw(){ctx.clearRect(0,0,cv.width,cv.height);if(!box)return;ctx.fillStyle='rgba(239,85,85,.16)';ctx.strokeStyle='#ef5555';ctx.lineWidth=2;ctx.fillRect(box.x*cv.width,box.y*cv.height,box.w*cv.width,box.h*cv.height);ctx.strokeRect(box.x*cv.width,box.y*cv.height,box.w*cv.width,box.h*cv.height)}
cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();start={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};cv.setPointerCapture(e.pointerId)};cv.onpointerup=e=>{if(!start)return;const r=cv.getBoundingClientRect(),p={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};box={x:Math.min(start.x,p.x),y:Math.min(start.y,p.y),w:Math.abs(start.x-p.x),h:Math.abs(start.y-p.y)};start=null;$('selection').textContent=`圈选区域：${Math.round(box.x*100)}%, ${Math.round(box.y*100)}% · ${Math.round(box.w*100)}% × ${Math.round(box.h*100)}%`;draw()};new ResizeObserver(resize).observe(cv);
function pick(i){current=i;box=null;draw();$('slide').src=pages[i].url;document.querySelectorAll('.thumb').forEach((n,k)=>n.classList.toggle('active',i===k));$('selection').textContent='尚未圈选区域'}async function load(){if(!job){$('status').textContent='缺少任务 ID。请从工作台的“进入逐页精修”按钮打开。';return}const r=await fetch(`/api/ppt/jobs/${job}/preview`),d=await r.json();if(!r.ok){$('status').textContent=d.detail||'预览读取失败';return}pages=d.previews||[];$('thumbs').innerHTML=pages.map((p,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}"><img src="${p.url}" alt="第${i+1}页"><span>${i+1}</span></button>`).join('');document.querySelectorAll('.thumb').forEach(n=>n.onclick=()=>pick(+n.dataset.i));if(pages.length)pick(0);$('status').textContent=`任务 ${job}\n已载入 ${pages.length} 页。`}
$('submit').onclick=async()=>{if(!job||!pages.length)return;if(!box||box.w<.01||box.h<.01){$('status').textContent='请先在画面上圈选需要修改的区域。';return}const note=$('prompt').value.trim();if(!note){$('status').textContent='请填写修改提示词。';return}const bbox=[box.x*16,(1-box.y-box.h)*9,box.w*16,box.h*9].map(v=>+v.toFixed(4));const r=await fetch(`/api/ppt/jobs/${job}/editable-feedback`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({page_index:current+1,boxes:[{bbox,kind:'page_regeneration_request',note}]})}),d=await r.json();$('status').textContent=r.ok?'重绘要求已保存。当前版本会进入人工/执行器处理队列；页面图片不会在浏览器端伪造更新。':(d.detail||'保存失败')};$('reload').onclick=load;load();
</script></body></html>
