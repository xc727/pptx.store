<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPTX.STORE | 首页</title>
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Google Fonts: Noto Serif SC for headings, Noto Sans SC for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        /* === 基础重置与变量 === */
        :root {
            --bg-color: #f4f3ec; /* 米白底色 */
            --primary-green: #67b75b; /* 主题绿 */
            --primary-green-hover: #55994b;
            --text-dark: #222222;
            --text-light: #a0a0a0;
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1); /* 弹性跳跃曲线 */
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        h1, h2, h3, .logo {
            font-family: 'Noto Serif SC', serif;
            font-weight: 600;
        }
        
        body, p, a, input, button, textarea, select {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* === Loading 遮罩 === */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .progress-bar-container {
            width: 200px; height: 4px;
            background-color: #ddd;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar {
            width: 0%; height: 100%;
            background-color: var(--primary-green);
        }

        /* === 导航栏 === */
        header.global-nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(244, 243, 236, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        header.global-nav.transparent-nav {
            background: transparent;
            backdrop-filter: none;
            border-bottom: none;
        }
        .global-nav .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: var(--primary-green); text-decoration: none;}
        .global-nav .nav-links { display: flex; gap: 30px; align-items: center; }
        .global-nav .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 15px; position: relative; transition: color 0.3s ease; }
        .global-nav .nav-links a:hover { color: var(--primary-green); }
        
        /* 按钮水面波浪效果 (Bottom-to-Top Fill) */
        .btn-wave {
            position: relative;
            padding: 10px 24px;
            border-radius: 8px;
            background: #fff;
            color: var(--primary-green) !important;
            font-weight: bold;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: color 0.3s ease;
            display: inline-block;
        }
        .btn-wave::before {
            content: '';
            position: absolute;
            bottom: -50%; left: -50%;
            width: 200%; height: 200%;
            background-color: var(--primary-green);
            border-radius: 40%; /* 模拟波浪 */
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
            animation: waveRotate 4s linear infinite;
        }
        @keyframes waveRotate { 0% { transform: translateY(100%) rotate(0deg); } 100% { transform: translateY(100%) rotate(360deg); } }
        .btn-wave:hover { color: #fff !important; }
        .btn-wave:hover::before { transform: translateY(-10%) rotate(0deg); animation: none; }

        /* === 首屏 (Hero Section) === */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .hero-title {
            text-align: center;
            z-index: 10;
        }
        .hero-title h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1.2;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
        }
        .hero-title p {
            font-size: 1.2rem;
            color: #555;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(20px);
        }

        /* 有机呼吸流体动画元素 (还原第一版重叠布局) */
        .organic-shape {
            position: absolute;
            z-index: 1;
            border-radius: 50% 40% 60% 40% / 40% 50% 40% 60%;
            overflow: hidden;
            /* 复合呼吸动画 */
            animation: breathe 8s infinite alternate ease-in-out;
            cursor: pointer;
            transition: transform 0.4s var(--spring-easing), filter 0.4s ease;
        }
        .organic-shape img {
            width: 100%; height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        /* 鼠标悬停按压缩放回弹 */
        .organic-shape:hover {
            transform: scale(0.92) !important; /* 强制覆盖 GSAP 平移时的 scale，按压变扁 */
            filter: brightness(0.9);
        }

        @keyframes breathe {
            0% { border-radius: 50% 40% 60% 40% / 40% 50% 40% 60%; }
            50% { border-radius: 40% 60% 40% 50% / 60% 40% 50% 40%; }
            100% { border-radius: 60% 50% 50% 60% / 50% 60% 60% 40%; }
        }

        /* === 左静右动 (Sticky Split Section) === */
        .sticky-section {
            display: flex;
            padding: 100px 5vw;
            min-height: 200vh; /* 创造滚动空间 */
            position: relative;
        }
        .sticky-left {
            width: 40%;
            position: sticky;
            top: 30vh; /* 固定在视口 30% 处 */
            height: fit-content;
        }
        .sticky-left h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .scroll-text {
            /* 初始浅灰色，通过 JS 切换 */
            color: var(--text-light);
            font-size: 1.1rem;
            line-height: 2;
            margin-bottom: 15px;
            transition: color 0.6s ease;
            font-weight: bold;
        }
        .scroll-text.active { color: var(--text-dark); }

        .scroll-right {
            width: 60%;
            display: flex;
            flex-direction: column;
            gap: 150px;
            padding-top: 10vh;
        }
        
        /* 图片拉入动画框架 */
        .reveal-container {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            /* 初始被遮罩完全隐藏 */
            clip-path: inset(100% 0 0 0);
        }
        .reveal-container img {
            width: 100%;
            display: block;
            border-radius: 20px;
            transform: translateY(20%); /* 内部图片的视差初始值 */
            transform-origin: center center;
        }

        /* === 底部波浪 (Wave Footer) === */
        .wave-footer-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: var(--bg-color);
            margin-top: 100px;
            overflow: hidden;
        }
        .waves {
            position: absolute;
            bottom: 0; width: 100%; height: 100%;
            min-height: 100px;
            max-height: 150px;
        }
        .parallax > use {
            animation: move-forever 25s cubic-bezier(.55,.5,.45,.5)     infinite;
        }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }

        @keyframes move-forever {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }

        .footer-content {
            background-color: var(--primary-green);
            padding: 50px;
            text-align: center;
            color: #fff;
        }
        .hand-drawn-icon {
            width: 120px; height: 120px;
            margin: 0 auto -60px auto;
            position: relative;
            z-index: 10;
        }

    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <h2 style="color: var(--primary-green); letter-spacing: 2px;">PPTX.STORE</h2>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- Unified Header -->
    <header class="global-nav transparent-nav">
        <a href="index.html" class="logo">PPTX.STORE</a>
        <div class="nav-links">
            <a href="index.html">首页</a>
            <a href="https://app.pptx.store/">PPT 工作台</a>
            <a href="https://app.pptx.store/book-split">文献拆分</a>
            <a href="services.html">服务介绍</a>
            <a href="about.html">关于我们</a>
            <a href="https://app.pptx.store/" class="btn-wave">立即体验 →</a>
        </div>
    </header>

    <!-- Hero Section (还原第一版叠放设计) -->
    <section class="hero">
        <!-- Floating Organic Shapes -->
        <div class="organic-shape float-elem" style="width: 300px; height: 280px; top: 15%; left: 10%;">
            <img src="https://images.unsplash.com/photo-1552664730-d307ca884978?auto=format&fit=crop&q=80&w=400" alt="Team">
        </div>
        <div class="organic-shape float-elem" style="width: 250px; height: 260px; bottom: 15%; left: 25%;">
            <img src="https://images.unsplash.com/photo-1542744173-8e7e53415bb0?auto=format&fit=crop&q=80&w=400" alt="Work">
        </div>
        <div class="organic-shape float-elem" style="width: 380px; height: 350px; top: 20%; right: 5%;">
            <img src="https://images.unsplash.com/photo-1600880292203-757bb62b4baf?auto=format&fit=crop&q=80&w=400" alt="Meeting">
        </div>

        <div class="hero-title">
            <h1 id="hero-h1">你的灵感<br>更为生动。</h1>
            <p id="hero-p">AI 驱动的 PPT 自动化工作台</p>
        </div>
    </section>

    <!-- Sticky Split Section -->
    <section class="sticky-section">
        <div class="sticky-left">
            <h2>为了成为<br>您的“依靠”</h2>
            <p class="scroll-text" data-trigger="text1">在人生的道路上，有时会遇到困难。</p>
            <p class="scroll-text" data-trigger="text2">面对不安的明天，有时需要他人的帮助。</p>
            <p class="scroll-text" data-trigger="text3">我们 PPTX 团队在这种时刻，<br>守护您的“灵感与创意”。</p>
            <br><br>
            <a href="https://app.pptx.store/" class="btn-wave">了解我们的工作台</a>
        </div>
        
        <div class="scroll-right">
            <!-- Reveal Image 1 -->
            <div style="margin-bottom: 50px;">
                <span style="color: var(--primary-green); font-weight: bold;">01 Fact</span>
                <div class="reveal-container" id="reveal-img-1">
                    <img class="reveal-inner" src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&q=80&w=800" alt="Fact 1">
                </div>
            </div>

            <!-- Reveal Image 2 -->
            <div style="margin-bottom: 50px;">
                <span style="color: var(--primary-green); font-weight: bold;">02 Vision</span>
                <div class="reveal-container" id="reveal-img-2">
                    <img class="reveal-inner" src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&q=80&w=800" alt="Fact 2">
                </div>
            </div>

            <!-- Reveal Image 3 -->
            <div style="margin-bottom: 50px;">
                <span style="color: var(--primary-green); font-weight: bold;">03 Action</span>
                <div class="reveal-container" id="reveal-img-3">
                    <img class="reveal-inner" src="https://images.unsplash.com/photo-1542744094-3a31f272c490?auto=format&fit=crop&q=80&w=800" alt="Fact 3">
                </div>
            </div>
        </div>
    </section>

    <!-- Wave Footer -->
    <div class="wave-footer-container">
        <!-- SVG 手绘小人占位 (放在波浪上方) -->
        <div class="hand-drawn-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="30" r="15" stroke="#222" stroke-width="4" fill="#f4f3ec"/>
                <path d="M50 45 L50 80 M50 60 L30 40 M50 60 L70 40 M50 80 L35 100 M50 80 L65 100" stroke="#222" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        
        <!-- SVG 波浪 -->
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(103, 183, 91, 0.3)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(103, 183, 91, 0.5)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(103, 183, 91, 0.7)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="var(--primary-green)" />
            </g>
        </svg>
    </div>
    <div class="footer-content">
        <h2 style="margin-bottom: 20px;">PPTX.STORE</h2>
        <p>© 2026 PPT 自动化工坊. All Rights Reserved.</p>
    </div>

    <!-- === 核心动画脚本 === -->
    <script>
        // 注册 ScrollTrigger
        gsap.registerPlugin(ScrollTrigger);

        // 1. Loading 动画
        window.addEventListener("load", () => {
            const tl = gsap.timeline();
            
            // 进度条增长
            tl.to("#progress-bar", { width: "100%", duration: 1.2, ease: "power2.inOut" })
            // 遮罩上滑消失
            .to("#loader", { yPercent: -100, duration: 0.8, ease: "power4.inOut" })
            // 首屏标题淡入弹跳
            .to("#hero-h1", { y: 0, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, "-=0.3")
            .to("#hero-p", { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, "-=0.6")
            // 浮动图片进入
            .from(".organic-shape", { 
                scale: 0, opacity: 0, duration: 1, 
                stagger: 0.2, ease: "elastic.out(1, 0.5)" 
            }, "-=0.5");
        });

        // 2. 浮动元素缓慢向右平移 (还原极慢漂移)
        gsap.utils.toArray('.float-elem').forEach((elem, i) => {
            gsap.to(elem, {
                x: 100, // 向右平移距离
                y: i % 2 === 0 ? 20 : -20, // 上下微调
                duration: 25 + i * 5, // 极慢的持续时间
                ease: "sine.inOut",
                repeat: -1,
                yoyo: true // 来回漂浮
            });
        });

        // 3. 滚动文字变色逻辑
        const observerOptions = {
            root: null,
            rootMargin: "-40% 0px -40% 0px", // 视口中央 20% 区域为触发区
            threshold: 0
        };

        const textObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const imgId = entry.target.id; 
                let textIndex = 1;
                if(imgId === 'reveal-img-1') textIndex = 1;
                if(imgId === 'reveal-img-2') textIndex = 2;
                if(imgId === 'reveal-img-3') textIndex = 3;
                
                const targetText = document.querySelector(`.scroll-text[data-trigger="text${textIndex}"]`);
                
                if(entry.isIntersecting) {
                    targetText.classList.add('active');
                } else {
                    targetText.classList.remove('active');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal-container').forEach(container => {
            textObserver.observe(container);
        });

        // 4. 滚动图片拉入展开动画 (clip-path)
        gsap.utils.toArray('.reveal-container').forEach(container => {
            const innerImg = container.querySelector('.reveal-inner');
            
            let tl = gsap.timeline({
                scrollTrigger: {
                    trigger: container,
                    start: "top 85%", // 当容器顶部到达视口 85% 时触发
                    toggleActions: "play none none reverse"
                }
            });

            tl.to(container, {
                clipPath: "inset(0% 0 0 0)",
                duration: 1.2,
                ease: "power3.inOut"
            })
            .to(innerImg, {
                y: "0%",
                scale: 1,
                duration: 1.2,
                ease: "power3.inOut"
            }, 0); 
        });

        // 导航栏滚动交互：当页面滚动时添加背景毛玻璃
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('header.global-nav');
            if (window.scrollY > 50) {
                nav.classList.remove('transparent-nav');
            } else {
                nav.classList.add('transparent-nav');
            }
        });
    </script>
</body>
</html>
