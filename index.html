<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPTX.STORE | 首页</title>
    <!-- GSAP & ScrollTrigger -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    
    <!-- Google Fonts: Noto Serif SC for headings, Noto Sans SC for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet">
    
    <style>
        /* === 基础重置与变量 === */
        :root {
            --bg-color: #f4f3ec; /* 米白底色 */
            --primary-green: #67b75b; /* 主题绿 */
            --primary-green-hover: #55994b;
            --text-dark: #222222;
            --text-light: #a0a0a0;
            --spring-easing: cubic-bezier(0.34, 1.56, 0.64, 1); /* 弹性跳跃曲线 */
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        h1, h2, h3, .logo {
            font-family: 'Noto Serif SC', serif;
            font-weight: 600;
        }
        
        body, p, a, input, button, textarea, select {
            font-family: 'Noto Sans SC', sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* === Loading 遮罩 === */
        #loader {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .progress-bar-container {
            width: 200px; height: 4px;
            background-color: #ddd;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar {
            width: 0%; height: 100%;
            background-color: var(--primary-green);
        }

        /* === 导航栏 === */
        header.global-nav {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(244, 243, 236, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        header.global-nav.transparent-nav {
            background: transparent;
            backdrop-filter: none;
            border-bottom: none;
        }
        .global-nav .logo { font-size: 24px; font-weight: bold; letter-spacing: 2px; color: var(--primary-green); text-decoration: none;}
        .global-nav .nav-links { display: flex; gap: 30px; align-items: center; }
        .global-nav .nav-links a { text-decoration: none; color: var(--text-dark); font-weight: 500; font-size: 15px; position: relative; transition: color 0.3s ease; }
        .global-nav .nav-links a:hover, .global-nav .nav-links a.active { color: var(--primary-green); }
        
        /* 按钮水面波浪效果 (Bottom-to-Top Fill) */
        .btn-wave {
            position: relative;
            padding: 10px 24px;
            border-radius: 8px;
            background: #fff;
            color: var(--primary-green) !important;
            font-weight: bold;
            text-decoration: none;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: color 0.3s ease;
            display: inline-block;
        }
        .btn-wave::before {
            content: '';
            position: absolute;
            bottom: -50%; left: -50%;
            width: 200%; height: 200%;
            background-color: var(--primary-green);
            border-radius: 40%; /* 模拟波浪 */
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: -1;
            animation: waveRotate 4s linear infinite;
        }
        @keyframes waveRotate { 0% { transform: translateY(100%) rotate(0deg); } 100% { transform: translateY(100%) rotate(360deg); } }
        .btn-wave:hover { color: #fff !important; }
        .btn-wave:hover::before { transform: translateY(-10%) rotate(0deg); animation: none; }

        /* === 首屏 (Hero Section) === */
        .hero {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .hero-title {
            text-align: center;
            z-index: 10;
            color: #fff;
            mix-blend-mode: difference;
        }
        .hero-title h1 {
            font-size: clamp(3rem, 6vw, 5rem);
            font-weight: 900;
            letter-spacing: 4px;
            line-height: 1.2;
            margin-bottom: 20px;
            opacity: 0;
            transform: translateY(30px);
            color: currentColor;
        }
        .hero-title p {
            font-size: 1.2rem;
            color: currentColor;
            letter-spacing: 2px;
            opacity: 0;
            transform: translateY(20px);
        }

        .hero-drift-field {
            position: absolute;
            inset: 7% -14% 8% -14%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        .hero-drift-track {
            position: absolute;
            top: 11%;
            left: 0;
            display: flex;
            align-items: center;
            gap: 4vw;
            width: max-content;
            animation: heroDriftLeft 92s linear infinite;
            will-change: transform;
        }
        .hero-drift-track:hover { animation-play-state: paused; }
        .organic-shape {
            flex: 0 0 auto;
            width: auto;
            max-width: clamp(260px, var(--shape-width, 28vw), 560px);
            margin-top: var(--float-y, 0vh);
            border-radius: 22% 28% 24% 32% / 26% 20% 30% 24%;
            overflow: hidden;
            transform: translateY(0) rotate(var(--tilt, 0deg));
            animation: templateFloat 8s infinite alternate ease-in-out, waterBlob 9s infinite alternate ease-in-out;
            animation-delay: var(--delay, 0s), calc(var(--delay, 0s) * -0.7);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.62s cubic-bezier(.2,.9,.2,1), filter 0.48s ease, box-shadow 0.48s ease, border-radius 0.62s ease;
            box-shadow: 0 24px 62px rgba(68, 94, 62, 0.13);
            background: #fff;
        }
        .organic-shape img {
            display: block;
            width: auto;
            height: clamp(210px, var(--shape-height, 32vh), 390px);
            max-width: inherit;
            object-fit: contain;
            pointer-events: none;
        }
        .organic-shape:hover {
            z-index: 5;
            animation-play-state: paused;
            transform: translateY(-18px) scale(1.18) rotate(0deg) !important;
            filter: brightness(1.03) saturate(1.08);
            box-shadow: 0 34px 86px rgba(68, 94, 62, 0.2);
            border-radius: 16% 22% 18% 26% / 20% 16% 24% 18%;
        }

        @keyframes heroDriftLeft {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        @keyframes templateFloat {
            0% { transform: translateY(-10px) rotate(calc(var(--tilt, 0deg) - 1deg)); }
            100% { transform: translateY(12px) rotate(calc(var(--tilt, 0deg) + 1deg)); }
        }
        @keyframes waterBlob {
            0% { border-radius: 22% 28% 24% 32% / 26% 20% 30% 24%; }
            38% { border-radius: 42% 35% 39% 31% / 34% 43% 29% 38%; }
            72% { border-radius: 18% 24% 34% 22% / 22% 30% 20% 36%; }
            100% { border-radius: 28% 20% 26% 18% / 20% 30% 22% 28%; }
        }
        @media (max-width: 760px) {
            .hero-drift-field { inset: 12% -34% 12% -34%; }
            .hero-drift-track { gap: 28px; top: 8%; animation-duration: 78s; }
            .organic-shape { max-width: min(78vw, 330px); }
            .organic-shape img { height: clamp(190px, var(--shape-height, 30vh), 310px); }
        }

        /* === 左静右动 (Sticky Split Section) === */
        .sticky-section {
            display: flex;
            padding: 100px 5vw;
            min-height: 200vh; /* 创造滚动空间 */
            position: relative;
        }
        .sticky-left {
            width: 40%;
            position: sticky;
            top: 30vh; /* 固定在视口 30% 处 */
            height: fit-content;
        }
        .sticky-left h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .scroll-text {
            /* 初始浅灰色，通过 JS 切换 */
            color: var(--text-light);
            font-size: 1.1rem;
            line-height: 2;
            margin-bottom: 15px;
            transition: color 0.6s ease;
            font-weight: bold;
        }
        .scroll-text.active { color: var(--text-dark); }

        .scroll-right {
            width: 60%;
            display: flex;
            flex-direction: column;
            gap: 150px;
            padding-top: 10vh;
        }
        
        /* 图片拉入动画框架 */
        .reveal-container {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            /* 初始被遮罩完全隐藏 */
            clip-path: inset(100% 0 0 0);
        }
        .reveal-container img {
            width: 100%;
            display: block;
            border-radius: 20px;
            transform: translateY(20%); /* 内部图片的视差初始值 */
            transform-origin: center center;
        }

        /* === 底部波浪 (Wave Footer) === */
        .wave-footer-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: var(--bg-color);
            margin-top: 100px;
            overflow: hidden;
        }
        .waves {
            position: absolute;
            bottom: 0; width: 100%; height: 100%;
            min-height: 100px;
            max-height: 150px;
        }
        .parallax > use {
            animation: move-forever 25s cubic-bezier(.55,.5,.45,.5)     infinite;
        }
        .parallax > use:nth-child(1) { animation-delay: -2s; animation-duration: 7s; }
        .parallax > use:nth-child(2) { animation-delay: -3s; animation-duration: 10s; }
        .parallax > use:nth-child(3) { animation-delay: -4s; animation-duration: 13s; }
        .parallax > use:nth-child(4) { animation-delay: -5s; animation-duration: 20s; }

        @keyframes move-forever {
            0% { transform: translate3d(-90px,0,0); }
            100% { transform: translate3d(85px,0,0); }
        }

        .footer-content {
            background-color: var(--primary-green);
            padding: 50px;
            text-align: center;
            color: #fff;
        }
        .hand-drawn-icon {
            width: 120px; height: 120px;
            margin: 0 auto -60px auto;
            position: relative;
            z-index: 10;
        }

    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loader">
        <h2 style="color: var(--primary-green); letter-spacing: 2px;">PPTX.STORE</h2>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
    </div>

    <!-- Unified Header -->
    <header class="global-nav transparent-nav"></header>
    <script src="assets/site-nav.js" data-active="home"></script>

    <!-- Hero Section -->
    <section class="hero">
        <!-- Floating Organic Shapes -->
        <div class="hero-drift-field" aria-hidden="true">
            <div class="hero-drift-track" id="hero-drift-track"></div>
        </div>

        <div class="hero-title">
            <h1 id="hero-h1">你的灵感<br>更为生动。</h1>
            <p id="hero-p">AI 驱动的 PPT 自动化工作台</p>
        </div>
    </section>

    <!-- Sticky Split Section -->
    <section class="sticky-section">
        <div class="sticky-left">
            <h2>为了成为<br>您的“依靠”</h2>
            <p class="scroll-text" data-trigger="text1">在人生的道路上，有时会遇到困难。</p>
            <p class="scroll-text" data-trigger="text2">面对不安的明天，有时需要他人的帮助。</p>
            <p class="scroll-text" data-trigger="text3">我们 PPTX 团队在这种时刻，<br>守护您的“灵感与创意”。</p>
            <br><br>
            <a href="https://app.pptx.store/workbench" class="btn-wave">了解我们的工作台</a>
        </div>
        
        <div class="scroll-right">
            <!-- Reveal Image 1 -->
            <div style="margin-bottom: 50px;">
                <span style="color: var(--primary-green); font-weight: bold;">01 Fact</span>
                <div class="reveal-container" id="reveal-img-1">
                    <img class="reveal-inner" src="https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&q=80&w=800" alt="Fact 1">
                </div>
            </div>

            <!-- Reveal Image 2 -->
            <div style="margin-bottom: 50px;">
                <span style="color: var(--primary-green); font-weight: bold;">02 Vision</span>
                <div class="reveal-container" id="reveal-img-2">
                    <img class="reveal-inner" src="https://images.unsplash.com/photo-1553877522-43269d4ea984?auto=format&fit=crop&q=80&w=800" alt="Fact 2">
                </div>
            </div>

            <!-- Reveal Image 3 -->
            <div style="margin-bottom: 50px;">
                <span style="color: var(--primary-green); font-weight: bold;">03 Action</span>
                <div class="reveal-container" id="reveal-img-3">
                    <img class="reveal-inner" src="https://images.unsplash.com/photo-1542744094-3a31f272c490?auto=format&fit=crop&q=80&w=800" alt="Fact 3">
                </div>
            </div>
        </div>
    </section>

    <!-- Wave Footer -->
    <div class="wave-footer-container">
        <!-- SVG 手绘小人占位 (放在波浪上方) -->
        <div class="hand-drawn-icon">
            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="30" r="15" stroke="#222" stroke-width="4" fill="#f4f3ec"/>
                <path d="M50 45 L50 80 M50 60 L30 40 M50 60 L70 40 M50 80 L35 100 M50 80 L65 100" stroke="#222" stroke-width="4" stroke-linecap="round"/>
            </svg>
        </div>
        
        <!-- SVG 波浪 -->
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
            </defs>
            <g class="parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(103, 183, 91, 0.3)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(103, 183, 91, 0.5)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(103, 183, 91, 0.7)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="var(--primary-green)" />
            </g>
        </svg>
    </div>
    <div class="footer-content">
        <h2 style="margin-bottom: 20px;">PPTX.STORE</h2>
        <p>© 2026 PPT 自动化工坊. All Rights Reserved.</p>
    </div>

    <!-- === 核心动画脚本 === -->
    <script>
        // 注册 ScrollTrigger
        gsap.registerPlugin(ScrollTrigger);

        const templateImages = [
            "static/templates/颁奖.jpg",
            "static/templates/读书分享.jpg",
            "static/templates/非遗ppt模板.jpg",
            "static/templates/高端模板.jpg",
            "static/templates/高三班会模板.jpg",
            "static/templates/公司介绍.jpg",
            "static/templates/检察蓝模板.jpg",
            "static/templates/腊八节模板.jpg",
            "static/templates/玫瑰金理财模板.jpg",
            "static/templates/美味食堂模板.jpg",
            "static/templates/美妆模板.jpg",
            "static/templates/融资模板.jpg",
            "static/templates/商务模板2.jpg",
            "static/templates/现代模板.jpg",
            "static/templates/学生干部竞选模板.jpg",
            "static/templates/杂质风模板.jpg"
        ];

        const driftTrack = document.getElementById("hero-drift-track");
        if (driftTrack) {
            const shuffled = templateImages
                .map(src => ({ src, weight: Math.random() }))
                .sort((a, b) => a.weight - b.weight)
                .map(item => item.src);
            const doubled = [...shuffled, ...shuffled];
            driftTrack.innerHTML = doubled.map((src, index) => {
                const width = 21 + Math.random() * 10;
                const height = 24 + Math.random() * 16;
                const floatY = -7 + Math.random() * 26;
                const tilt = -3 + Math.random() * 6;
                const delay = -(index * 0.7 + Math.random() * 5);
                return `<div class="organic-shape" style="--shape-width:${width.toFixed(2)}vw; --shape-height:${height.toFixed(2)}vh; --float-y:${floatY.toFixed(2)}vh; --tilt:${tilt.toFixed(2)}deg; --delay:${delay.toFixed(2)}s;"><img src="${src}" alt=""></div>`;
            }).join("");
        }

        // 1. Loading 动画
        window.addEventListener("load", () => {
            const tl = gsap.timeline();
            
            // 进度条增长
            tl.to("#progress-bar", { width: "100%", duration: 1.2, ease: "power2.inOut" })
            // 遮罩上滑消失
            .to("#loader", { yPercent: -100, duration: 0.8, ease: "power4.inOut" })
            // 首屏标题淡入弹跳
            .to("#hero-h1", { y: 0, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, "-=0.3")
            .to("#hero-p", { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, "-=0.6");
        });

        // 3. 滚动文字变色逻辑
        const observerOptions = {
            root: null,
            rootMargin: "-40% 0px -40% 0px", // 视口中央 20% 区域为触发区
            threshold: 0
        };

        const textObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const imgId = entry.target.id; 
                let textIndex = 1;
                if(imgId === 'reveal-img-1') textIndex = 1;
                if(imgId === 'reveal-img-2') textIndex = 2;
                if(imgId === 'reveal-img-3') textIndex = 3;
                
                const targetText = document.querySelector(`.scroll-text[data-trigger="text${textIndex}"]`);
                
                if(entry.isIntersecting) {
                    targetText.classList.add('active');
                } else {
                    targetText.classList.remove('active');
                }
            });
        }, observerOptions);

        document.querySelectorAll('.reveal-container').forEach(container => {
            textObserver.observe(container);
        });

        // 4. 滚动图片拉入展开动画 (clip-path)
        gsap.utils.toArray('.reveal-container').forEach(container => {
            const innerImg = container.querySelector('.reveal-inner');
            
            let tl = gsap.timeline({
                scrollTrigger: {
                    trigger: container,
                    start: "top 85%", // 当容器顶部到达视口 85% 时触发
                    toggleActions: "play none none reverse"
                }
            });

            tl.to(container, {
                clipPath: "inset(0% 0 0 0)",
                duration: 1.2,
                ease: "power3.inOut"
            })
            .to(innerImg, {
                y: "0%",
                scale: 1,
                duration: 1.2,
                ease: "power3.inOut"
            }, 0); 
        });

        // 导航栏滚动交互：当页面滚动时添加背景毛玻璃
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('header.global-nav');
            if (window.scrollY > 50) {
                nav.classList.remove('transparent-nav');
            } else {
                nav.classList.add('transparent-nav');
            }
        });
    </script>
</body>
</html>
