<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家乡介绍抽签</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family: 'Microsoft YaHei', '微软雅黑', sans-serif;
      background: #080818;
      min-height: 100vh;
      color: #fff;
      overflow: hidden;
    }

    canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
    #cvStars  { z-index:1; }
    #cvConfetti { z-index:99; }

    /* ── screen switcher ── */
    .page { display:none; position:fixed; inset:0; z-index:10;
            flex-direction:column; align-items:center; justify-content:center;
            padding:28px; overflow-y:auto; }
    .page.active { display:flex; }

    /* ══════════════ SETUP ══════════════ */
    #pSetup { gap:24px; }

    .logo { font-size:3.4rem; line-height:1; text-align:center; }
    .big-title {
      font-size:2.4rem; font-weight:900; letter-spacing:6px;
      color:#FFD700; text-shadow:0 0 30px rgba(255,215,0,.5);
      text-align:center;
    }
    .hint { font-size:.9rem; color:rgba(255,255,255,.45); letter-spacing:2px; }

    .setup-card {
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,215,0,.25);
      border-radius:22px; padding:36px 48px;
      display:flex; flex-direction:column; gap:14px;
      backdrop-filter:blur(10px);
      width:min(400px, 92vw);
    }
    .setup-card label { font-size:.8rem; color:rgba(255,255,255,.5); letter-spacing:1px; }
    .name-row {
      display:flex; align-items:center; gap:12px;
    }
    .name-idx {
      width:28px; height:28px; border-radius:50%;
      background:linear-gradient(135deg,#c0392b,#e74c3c);
      display:flex; align-items:center; justify-content:center;
      font-size:.8rem; font-weight:700; flex-shrink:0;
    }
    .name-in {
      flex:1; padding:11px 14px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,215,0,.3);
      border-radius:8px; color:#fff;
      font-size:1rem; outline:none; font-family:inherit;
      transition:border-color .2s, box-shadow .2s;
    }
    .name-in:focus { border-color:#FFD700; box-shadow:0 0 10px rgba(255,215,0,.2); }
    .name-in.err   { border-color:#e74c3c; animation:shake .35s; }
    @keyframes shake{0%,100%{transform:translateX(0)}33%{transform:translateX(-6px)}67%{transform:translateX(6px)}}

    .btn {
      border:none; border-radius:50px; cursor:pointer;
      font-family:inherit; font-weight:700; letter-spacing:3px;
      transition:transform .18s, box-shadow .18s;
    }
    .btn:hover:not(:disabled) { transform:translateY(-3px); }
    .btn:disabled { opacity:.45; cursor:not-allowed; transform:none !important; }

    .btn-red {
      padding:15px 52px; font-size:1.1rem;
      background:linear-gradient(135deg,#c0392b,#e74c3c);
      color:#fff; box-shadow:0 4px 22px rgba(192,57,43,.4);
    }
    .btn-red:hover:not(:disabled) { box-shadow:0 8px 32px rgba(192,57,43,.65); }

    /* ══════════════ MAIN ══════════════ */
    #pMain { gap:20px; }

    .panel-title { font-size:1.8rem; color:#FFD700; letter-spacing:4px; text-align:center; }
    .panel-sub { font-size:.82rem; color:rgba(255,255,255,.4); letter-spacing:2px; }

    .cards-row { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }

    .p-card {
      width:104px; height:104px; border-radius:18px;
      background:rgba(255,255,255,.06);
      border:1px solid rgba(255,215,0,.28);
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:7px;
      font-size:1rem; font-weight:600;
      position:relative; overflow:hidden;
      box-shadow:0 0 14px rgba(255,215,0,.1);
      transition:all .3s;
    }
    .p-card.done {
      opacity:.3; box-shadow:none;
      border-color:rgba(255,255,255,.08);
    }
    .p-card.done::after {
      content:'✓'; position:absolute;
      font-size:3rem; color:#2ecc71; opacity:.6;
    }
    .p-ico {
      width:36px; height:36px; border-radius:50%;
      background:linear-gradient(135deg,#f39c12,#e67e22);
      display:flex; align-items:center; justify-content:center;
      font-size:1.15rem; box-shadow:0 0 10px rgba(243,156,18,.4);
    }
    .p-card.done .p-ico { background:rgba(255,255,255,.1); box-shadow:none; }

    .btn-draw {
      padding:18px 80px; font-size:1.4rem;
      background:linear-gradient(135deg,#9b1d20,#c0392b 40%,#e74c3c 60%,#c0392b);
      color:#fff; border:2px solid rgba(255,215,0,.4);
      box-shadow:0 6px 30px rgba(192,57,43,.5);
      position:relative; overflow:hidden;
    }
    .btn-draw::before {
      content:''; position:absolute;
      top:-50%; left:-60%; width:35%; height:200%;
      background:rgba(255,255,255,.14); transform:skewX(-20deg);
      animation:shine 2.6s infinite;
    }
    @keyframes shine{ 0%{left:-60%} 100%{left:140%} }
    .btn-draw:hover:not(:disabled) { box-shadow:0 10px 44px rgba(192,57,43,.7); }
    .btn-draw:disabled::before { animation:none; }

    .rec-wrap { width:min(480px,92vw); }
    .rec-lbl { font-size:.78rem; color:rgba(255,255,255,.38); text-align:center; letter-spacing:3px; margin-bottom:10px; }
    .rec-item {
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.07);
      border-radius:10px; padding:10px 16px;
      display:flex; align-items:center; gap:12px; margin-bottom:8px;
    }
    .rec-no {
      width:26px; height:26px; border-radius:50%;
      background:linear-gradient(135deg,#c0392b,#e74c3c);
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; font-weight:700; flex-shrink:0;
    }
    .rec-name { font-size:1rem; color:#FFD700; font-weight:700; }
    .rec-t { font-size:.72rem; color:rgba(255,255,255,.33); margin-left:auto; }

    /* ══════════════ DRAWING ══════════════ */
    #pDraw { gap:32px; }

    .tip { font-size:1rem; color:rgba(255,255,255,.5); letter-spacing:3px; animation:blink 1s infinite; }
    @keyframes blink{0%,100%{opacity:.5}50%{opacity:1}}

    .drum {
      width:256px; height:256px; border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#1e2a4a,#0c0c1c);
      border:3px solid #FFD700;
      display:flex; align-items:center; justify-content:center;
      box-shadow:0 0 50px rgba(255,215,0,.3), inset 0 0 40px rgba(0,0,0,.5);
      animation:dpulse .55s ease-in-out infinite;
    }
    @keyframes dpulse{0%,100%{transform:scale(1);box-shadow:0 0 50px rgba(255,215,0,.3)}50%{transform:scale(1.03);box-shadow:0 0 72px rgba(255,215,0,.55)}}
    #drumName {
      font-size:2.1rem; font-weight:900; color:#fff; text-align:center; padding:0 18px;
      text-shadow:0 0 20px rgba(255,215,0,.7); animation:dnf .12s infinite;
    }
    @keyframes dnf{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.82;transform:scale(.96)}}

    /* ══════════════ RESULT ══════════════ */
    #pResult { gap:26px; }

    .res-card {
      background:rgba(255,255,255,.05);
      border:2px solid #FFD700; border-radius:28px;
      padding:50px 68px; text-align:center;
      box-shadow:0 0 60px rgba(255,215,0,.2);
      animation:popin .5s cubic-bezier(.175,.885,.32,1.275);
    }
    @keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
    .res-label { font-size:.9rem; color:rgba(255,255,255,.5); letter-spacing:3px; margin-bottom:14px; }
    .res-winner {
      font-size:4.2rem; font-weight:900; color:#FFD700; margin-bottom:14px;
      text-shadow:0 0 50px rgba(255,215,0,.6); animation:glow 1.6s ease-in-out infinite;
    }
    @keyframes glow{0%,100%{text-shadow:0 0 50px rgba(255,215,0,.6)}50%{text-shadow:0 0 85px rgba(255,215,0,.95)}}
    .res-task { font-size:1.05rem; color:rgba(255,255,255,.8); letter-spacing:2px; }
    .res-round { font-size:.8rem; color:rgba(255,255,255,.35); margin-top:10px; }

    .btn-ghost {
      padding:13px 50px; font-size:.98rem;
      background:transparent;
      border:2px solid rgba(255,215,0,.45);
      color:#FFD700;
    }
    .btn-ghost:hover { background:rgba(255,215,0,.1); border-color:#FFD700; }

    /* ══════════════ FINAL ══════════════ */
    #pFinal { gap:20px; overflow-y:auto; }

    .final-title { font-size:2rem; color:#FFD700; letter-spacing:5px; text-align:center; }
    .final-sub { font-size:.82rem; color:rgba(255,255,255,.42); letter-spacing:2px; }
    .final-list { width:min(400px,92vw); }
    .f-item {
      background:rgba(255,255,255,.05); border:1px solid rgba(255,215,0,.18);
      border-radius:14px; padding:13px 20px;
      display:flex; align-items:center; gap:16px; margin-bottom:10px;
      animation:slideup .4s ease-out both;
    }
    @keyframes slideup{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
    .f-no { font-size:1.5rem; color:#FFD700; font-weight:900; width:28px; }
    .f-name { font-size:1.2rem; font-weight:700; }
    .f-t { font-size:.75rem; color:rgba(255,255,255,.33); margin-left:auto; }
    .final-done { font-size:.85rem; color:rgba(255,255,255,.38); letter-spacing:3px; }
  </style>
</head>
<body>

<canvas id="cvStars"></canvas>
<canvas id="cvConfetti"></canvas>

<!-- ════════ SETUP ════════ -->
<div class="page active" id="pSetup">
  <div class="logo">🎋</div>
  <div class="big-title">家乡介绍抽签</div>
  <div class="hint">填写五位参与者姓名，开始随机抽签</div>
  <div class="setup-card">
    <label>参与者名单（共 5 人）</label>
    <div class="name-row"><div class="name-idx">1</div><input class="name-in" id="n1" placeholder="参与者 1" maxlength="8"></div>
    <div class="name-row"><div class="name-idx">2</div><input class="name-in" id="n2" placeholder="参与者 2" maxlength="8"></div>
    <div class="name-row"><div class="name-idx">3</div><input class="name-in" id="n3" placeholder="参与者 3" maxlength="8"></div>
    <div class="name-row"><div class="name-idx">4</div><input class="name-in" id="n4" placeholder="参与者 4" maxlength="8"></div>
    <div class="name-row"><div class="name-idx">5</div><input class="name-in" id="n5" placeholder="参与者 5" maxlength="8"></div>
    <button class="btn btn-red" id="btnStart" onclick="setupDone()">确 定，开 始 抽 签</button>
  </div>
</div>

<!-- ════════ MAIN ════════ -->
<div class="page" id="pMain">
  <div class="panel-title">🎋 家乡介绍抽签</div>
  <div class="panel-sub" id="subTxt"></div>
  <div class="cards-row" id="cardsRow"></div>
  <button class="btn btn-draw" id="btnDraw" onclick="startDraw()">🎊 开始抽签</button>
  <div class="rec-wrap" id="recWrap" style="display:none">
    <div class="rec-lbl">— 已抽取记录 —</div>
    <div id="recList"></div>
  </div>
</div>

<!-- ════════ DRAWING ════════ -->
<div class="page" id="pDraw">
  <div class="tip">✨ 命运之手正在选择 ✨</div>
  <div class="drum"><div id="drumName">???</div></div>
  <div class="tip">抽签进行中，请稍候…</div>
</div>

<!-- ════════ RESULT ════════ -->
<div class="page" id="pResult">
  <div class="res-card">
    <div class="res-label">🎉 本次抽签结果</div>
    <div class="res-winner" id="resWinner">—</div>
    <div class="res-task">将进行家乡介绍分享</div>
    <div class="res-round" id="resRound"></div>
  </div>
  <button class="btn btn-ghost" id="btnCont" onclick="afterResult()">继 续 →</button>
</div>

<!-- ════════ FINAL ════════ -->
<div class="page" id="pFinal">
  <div class="final-title">🏆 抽签完毕</div>
  <div class="final-sub">全部 5 位参与者均已完成抽签</div>
  <div class="final-list" id="finalList"></div>
  <div class="final-done">— 感谢参与，祝分享顺利 —</div>
</div>

<script>
/* ─── config ─── */
const KEY = "hometown_lottery_v2";
const ICOS = ["🏠","🌏","🌸","🍜","🎭"];

/* ─── state ─── */
let S = { names:[], left:[], drawn:[] };

function load() {
  try { const r = localStorage.getItem(KEY); if (r) S = JSON.parse(r); } catch(_){}
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(_){}
}

/* ─── page switching ─── */
function go(id) {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ─── SETUP ─── */
function setupDone() {
  const ids = ["n1","n2","n3","n4","n5"];
  const vals = ids.map(id => document.getElementById(id).value.trim());
  let ok = true;
  ids.forEach((id, i) => {
    const el = document.getElementById(id);
    if (!vals[i]) {
      el.classList.add("err");
      setTimeout(() => el.classList.remove("err"), 400);
      ok = false;
    }
  });
  if (!ok) return;
  S = { names: vals, left: [...vals], drawn: [] };
  save();
  renderMain();
  go("pMain");
}

/* ─── MAIN ─── */
function renderMain() {
  const row = document.getElementById("cardsRow");
  row.innerHTML = "";
  S.names.forEach((n, i) => {
    const done = !S.left.includes(n);
    const d = document.createElement("div");
    d.className = "p-card" + (done ? " done" : "");
    d.innerHTML = `<div class="p-ico">${ICOS[i]}</div><div>${n}</div>`;
    row.appendChild(d);
  });

  document.getElementById("subTxt").textContent =
    S.left.length > 0 ? `剩余 ${S.left.length} 人未抽取` : "所有人均已抽取";

  if (S.drawn.length > 0) {
    document.getElementById("recWrap").style.display = "";
    const list = document.getElementById("recList");
    list.innerHTML = "";
    S.drawn.forEach((d, i) => {
      const el = document.createElement("div");
      el.className = "rec-item";
      el.innerHTML = `<div class="rec-no">${i+1}</div>
                      <div class="rec-name">${d.name}</div>
                      <div class="rec-t">${d.t}</div>`;
      list.appendChild(el);
    });
  } else {
    document.getElementById("recWrap").style.display = "none";
  }

  const btn = document.getElementById("btnDraw");
  if (S.left.length === 0) {
    btn.disabled = true; btn.textContent = "✅ 抽签全部完成";
  } else {
    btn.disabled = false; btn.textContent = "🎊 开始抽签";
  }
}

/* ─── DRAW animation ─── */
function startDraw() {
  if (!S.left.length) return;
  go("pDraw");
  const winner = S.left[Math.floor(Math.random() * S.left.length)];
  const el = document.getElementById("drumName");
  let f = 0;

  const t = setInterval(() => {
    el.textContent = S.left[Math.floor(Math.random() * S.left.length)];
    if (++f >= 44) {
      clearInterval(t);
      el.style.animation = "none";
      el.style.color = "#FFD700";
      el.style.fontSize = "2.7rem";
      el.textContent = winner;
      setTimeout(() => revealResult(winner), 860);
    }
  }, 72);
}

function revealResult(winner) {
  const now = new Date();
  const ts = [now.getHours(), now.getMinutes(), now.getSeconds()].map(v => String(v).padStart(2,"0")).join(":");
  S.left = S.left.filter(n => n !== winner);
  S.drawn.push({ name: winner, t: ts });
  save();

  /* reset drum */
  setTimeout(() => {
    const el = document.getElementById("drumName");
    el.textContent = "???"; el.style.animation = ""; el.style.color = ""; el.style.fontSize = "";
  }, 50);

  document.getElementById("resWinner").textContent = winner;
  document.getElementById("resRound").textContent = `第 ${S.drawn.length} 轮抽取`;
  document.getElementById("btnCont").textContent = S.left.length === 0 ? "查看完整记录 →" : "继 续 →";

  go("pResult");
  launchConfetti();
}

function afterResult() {
  if (!S.left.length) { renderFinal(); go("pFinal"); }
  else { renderMain(); go("pMain"); }
}

/* ─── FINAL ─── */
function renderFinal() {
  const list = document.getElementById("finalList");
  list.innerHTML = "";
  S.drawn.forEach((d, i) => {
    const el = document.createElement("div");
    el.className = "f-item"; el.style.animationDelay = (i * .08) + "s";
    el.innerHTML = `<div class="f-no">${i+1}</div><div class="f-name">${d.name}</div><div class="f-t">${d.t}</div>`;
    list.appendChild(el);
  });
}

/* ─── CONFETTI ─── */
function launchConfetti() {
  const cv = document.getElementById("cvConfetti"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const COLS = ["#FFD700","#FF6B6B","#4ECDC4","#45B7D1","#96CEB4","#FFEAA7","#ff9ff3"];
  const pts = Array.from({length:140}, () => ({
    x: Math.random()*cv.width, y:-12,
    vx:(Math.random()-.5)*8, vy:Math.random()*4+2,
    sz:Math.random()*9+4, rot:Math.random()*360, rs:(Math.random()-.5)*14,
    col:COLS[Math.floor(Math.random()*COLS.length)]
  }));
  let f=0;
  (function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rs;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.col; ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);
      ctx.restore();
    });
    if(++f<140) requestAnimationFrame(draw);
    else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ─── STARS ─── */
(function(){
  const cv = document.getElementById("cvStars"), ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const pts = Array.from({length:160}, ()=>({
    x:Math.random()*cv.width, y:Math.random()*cv.height,
    r:Math.random()*1.4+.3, a:Math.random(), s:Math.random()*.016+.004
  }));
  (function loop(){
    ctx.clearRect(0,0,cv.width,cv.height);
    pts.forEach(p=>{ p.a+=p.s; if(p.a>1||p.a<0) p.s*=-1;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,255,255,${p.a.toFixed(2)})`; ctx.fill(); });
    requestAnimationFrame(loop);
  })();
})();

/* ─── INIT ─── */
load();
if (S.drawn.length > 0 && S.drawn.length === S.names.length && S.names.length === 5) {
  renderFinal(); go("pFinal");
} else if (S.names.length === 5) {
  renderMain(); go("pMain");
} else {
  go("pSetup");
}
</script>
</body>
</html>
