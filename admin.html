<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PPT 后台使用情况</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #14213d;
      --muted: #667085;
      --line: #d7ddeb;
      --blue: #2563eb;
      --green: #12805c;
      --red: #b42318;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(1180px, calc(100% - 32px));
      margin: 32px auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
      line-height: 1.2;
    }
    .muted { color: var(--muted); }
    .auth {
      display: grid;
      grid-template-columns: minmax(220px, 320px) 96px;
      gap: 8px;
    }
    input, button {
      height: 42px;
      border-radius: 6px;
      font: inherit;
    }
    input {
      border: 1px solid var(--line);
      padding: 0 12px;
      background: #fff;
      color: var(--text);
    }
    button {
      border: 0;
      color: #fff;
      background: var(--blue);
      font-weight: 700;
      cursor: pointer;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .card, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }
    .card strong {
      display: block;
      font-size: 28px;
      line-height: 1;
      margin-bottom: 8px;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 16px;
      align-items: start;
    }
    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      text-align: left;
      border-bottom: 1px solid var(--line);
      padding: 10px 8px;
      vertical-align: top;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      white-space: nowrap;
    }
    .status-done { color: var(--green); font-weight: 700; }
    .status-failed { color: var(--red); font-weight: 700; }
    .topic {
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .message {
      min-height: 28px;
      color: var(--muted);
      margin: 8px 0 16px;
    }
    @media (max-width: 900px) {
      header, .layout { grid-template-columns: 1fr; display: grid; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .auth { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>PPT 后台使用情况</h1>
        <div class="muted">查看任务量、成功失败、页数、耗时和最近任务。</div>
      </div>
      <div class="auth">
        <input id="admin-key" type="password" placeholder="后台口令">
        <button id="load-btn" type="button">刷新</button>
      </div>
    </header>

    <div id="message" class="message">请输入后台口令后刷新。</div>

    <section class="grid">
      <div class="card"><strong id="jobs">-</strong><span>总任务</span></div>
      <div class="card"><strong id="done">-</strong><span>成功</span></div>
      <div class="card"><strong id="failed">-</strong><span>失败</span></div>
      <div class="card"><strong id="running">-</strong><span>进行中</span></div>
      <div class="card"><strong id="pages">-</strong><span>请求页数</span></div>
      <div class="card"><strong id="avg">-</strong><span>平均耗时</span></div>
    </section>

    <div class="layout">
      <section class="panel">
        <h2>按日期</h2>
        <table>
          <thead><tr><th>日期</th><th>任务数</th></tr></thead>
          <tbody id="by-day"></tbody>
        </table>
      </section>
      <section class="panel">
        <h2>最近任务</h2>
        <table>
          <thead><tr><th>状态</th><th>主题</th><th>页数</th><th>创建时间</th><th>错误</th></tr></thead>
          <tbody id="recent-jobs"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script>
    const keyInput = document.getElementById('admin-key');
    const message = document.getElementById('message');
    const savedKey = localStorage.getItem('ppt_admin_key') || '';
    keyInput.value = savedKey;

    function text(id, value) {
      document.getElementById(id).textContent = value;
    }

    function seconds(value) {
      if (value === null || value === undefined) return '-';
      if (value < 60) return Math.round(value) + ' 秒';
      return Math.round(value / 60) + ' 分钟';
    }

    function localTime(value) {
      if (!value) return '-';
      return new Date(value).toLocaleString('zh-CN');
    }

    async function loadUsage() {
      const key = keyInput.value.trim();
      if (!key) {
        message.textContent = '请输入后台口令。';
        return;
      }
      localStorage.setItem('ppt_admin_key', key);
      message.textContent = '正在读取后台数据……';

      const resp = await fetch('/api/admin/usage', { headers: { 'x-admin-key': key } });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error || data.detail || '读取失败');

      text('jobs', data.totals.jobs);
      text('done', data.totals.done);
      text('failed', data.totals.failed);
      text('running', data.totals.running);
      text('pages', data.totals.pages_requested);
      text('avg', seconds(data.totals.average_terminal_seconds));

      document.getElementById('by-day').innerHTML = Object.entries(data.by_day || {})
        .reverse()
        .map(([day, count]) => `<tr><td>${day}</td><td>${count}</td></tr>`)
        .join('');

      document.getElementById('recent-jobs').innerHTML = (data.recent_jobs || [])
        .map((job) => {
          const cls = job.status === 'done' ? 'status-done' : job.status === 'failed' ? 'status-failed' : '';
          return `<tr>
            <td class="${cls}">${job.status || '-'}</td>
            <td class="topic" title="${job.topic || ''}">${job.topic || '-'}</td>
            <td>${job.page_count || '-'}</td>
            <td>${localTime(job.created_at)}</td>
            <td>${job.error || ''}</td>
          </tr>`;
        })
        .join('');

      message.textContent = `服务在线：${data.pipeline_mode}`;
    }

    document.getElementById('load-btn').addEventListener('click', () => {
      loadUsage().catch((error) => {
        message.textContent = String(error.message || error);
      });
    });

    if (savedKey) {
      loadUsage().catch(() => {});
    }
  </script>
</body>
</html>
