<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线 PPT 编辑｜PPTX.STORE</title><link rel="icon" href="/favicon.ico?v=20260914" sizes="any"><link rel="icon" type="image/png" href="/logo.png?v=20260914"><link rel="apple-touch-icon" href="/logo.png?v=20260914"><style>
:root{--b:#4658f6;--ink:#18213d;--muted:#7b849b;--line:#e1e5ef;--bg:#eef2f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px "Microsoft YaHei UI",sans-serif}button,input{font:inherit}header{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px}.brand{text-decoration:none;color:var(--ink);font-weight:900}.tools{display:flex;gap:7px}.btn{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:#fff;color:var(--ink);text-decoration:none;cursor:pointer}.primary{background:var(--b);border-color:var(--b);color:#fff}main{height:calc(100vh - 62px);display:grid;grid-template-columns:210px 1fr 270px;gap:1px;background:var(--line)}aside,section{background:#fff;min-height:0;overflow:auto}.pane-title{padding:14px;border-bottom:1px solid var(--line);font-weight:800}.thumbs{padding:11px;display:grid;gap:9px}.thumb{padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:#edf0f6;position:relative}.thumb.active{border-color:var(--b)}.thumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}.workarea{background:#f2f5fa;display:grid;grid-template-rows:48px 1fr}.toolbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:6px 12px}.canvas-wrap{display:grid;place-items:center;padding:28px;overflow:auto}.canvas{width:min(100%,1050px);aspect-ratio:16/9;position:relative;background:#fff;box-shadow:0 18px 45px rgba(28,43,81,.16);overflow:hidden}.canvas>img{width:100%;height:100%;object-fit:contain}.text-layer{position:absolute;min-width:120px;min-height:36px;padding:6px 8px;border:1px dashed var(--b);background:rgba(255,255,255,.78);left:10%;top:10%;cursor:move}.properties{padding:14px}.properties label{display:block;font-weight:800;margin:14px 0 6px}.properties input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px}.notice{padding:11px;border-radius:9px;background:#fff6df;color:#825b18;font-size:12px;line-height:1.6}.muted{color:var(--muted);font-size:12px;line-height:1.55}@media(max-width:900px){main{grid-template-columns:145px 1fr}.props{grid-column:1/-1}.canvas-wrap{min-height:430px}}</style></head><body>
<header><a class="brand" href="/workbench">← PPTX.STORE · 在线编辑</a><div class="tools"><a class="btn" href="/workbench">返回工作台</a><a class="btn primary" id="download" href="#">下载可编辑 PPTX</a></div></header><main><aside><div class="pane-title">页面缩略图</div><div class="thumbs" id="thumbs"></div></aside><section class="workarea"><div class="toolbar"><button class="btn" id="addText">＋ 文本</button><button class="btn" disabled>图片</button><button class="btn" disabled>形状</button><span class="muted">浏览器轻编辑预览</span></div><div class="canvas-wrap"><div class="canvas" id="canvas"><img id="slide" alt="当前幻灯片"></div></div></section><aside class="props"><div class="pane-title">元素属性</div><div class="properties"><div class="notice">当前页提供轻量文字标注与版式核对。完整的元素级保存仍以下载后的可编辑 PPTX 为准；不会把浏览器中的临时修改伪装成已写入文件。</div><label>文字内容</label><input id="textValue" placeholder="选中或新增文本"><label>字号</label><input id="fontSize" type="number" value="28" min="10" max="96"><label>文字颜色</label><input id="color" type="color" value="#18213d"><p class="muted" id="state">请从工作台打开一个已完成的任务。</p></div></aside></main><script>
(function(){var _local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1)(:\d+)?$/.test(location.host);if(_local)return;try{var x=new XMLHttpRequest;x.open('GET','http://127.0.0.1:5001/api/health',false);x.timeout=500;x.send(null);if(x.status>=200&&x.status<300){try{var o=JSON.parse(x.responseText);if(o&&o.ok){location.replace('http://127.0.0.1:5001/ppt-editor'+location.search+location.hash)}}catch(_){}}}catch(_){}})();
const $=id=>document.getElementById(id),job=new URLSearchParams(location.search).get('job')||'';let pages=[],current=0,selected=null;async function load(){if(!job)return;const r=await fetch(`/api/ppt/jobs/${job}/preview`),d=await r.json();if(!r.ok)return;$('download').href=`/api/ppt/jobs/${job}/download/editable-pptx`;pages=d.previews||[];$('thumbs').innerHTML=pages.map((p,i)=>`<button class="thumb ${i===0?'active':''}" data-i="${i}"><img src="${p.url}" alt="第${i+1}页"></button>`).join('');document.querySelectorAll('.thumb').forEach(n=>n.onclick=()=>pick(+n.dataset.i));if(pages.length)pick(0);$('state').textContent=`已载入任务 ${job}，共 ${pages.length} 页。`}function pick(i){current=i;$('slide').src=pages[i].url;document.querySelectorAll('.thumb').forEach((n,k)=>n.classList.toggle('active',i===k));document.querySelectorAll('.text-layer').forEach(n=>n.remove());selected=null}function sync(){if(!selected)return;selected.textContent=$('textValue').value;selected.style.fontSize=$('fontSize').value+'px';selected.style.color=$('color').value}function addText(){const n=document.createElement('div');n.className='text-layer';n.contentEditable='true';n.textContent='双击编辑文字';n.onclick=e=>{e.stopPropagation();selected=n;$('textValue').value=n.textContent;$('fontSize').value=parseInt(getComputedStyle(n).fontSize);$('color').value='#18213d'};$('canvas').appendChild(n);selected=n;$('textValue').value=n.textContent}['textValue','fontSize','color'].forEach(id=>$(id).oninput=sync);$('addText').onclick=addText;load();
</script></body></html>
